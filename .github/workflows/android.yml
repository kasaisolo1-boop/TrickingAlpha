name: Build Tricking Alpha APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.4.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Godot
        run: |
          mkdir -p "$HOME/.config" "$HOME/.local/share/godot/export_templates"
          cp -a /root/.config/godot "$HOME/.config/" 2>/dev/null || true
          cp -a /root/.local/share/godot/export_templates/4.4.1.stable "$HOME/.local/share/godot/export_templates/" 

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Build APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/TrickingAlpha.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TrickingAlpha-APK
          path: build/TrickingAlpha.apk
